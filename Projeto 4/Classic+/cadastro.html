<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic+ | Criar Conta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

     
    <header class="navbar">
        <a href="index.html" aria-label="Voltar para a página inicial">
            <img src="imagens/logo-s.png" alt="Logo Classic Plus" class="logo-nav">
        </a>

        <nav aria-label="Navegação de retorno">
            <ul>
                <li><a href="index.html">← Voltar ao Início</a></li>
            </ul>
        </nav>
    </header>

     
    <main class="login-single-container">

        <section class="login-card" aria-labelledby="titulo-cadastro">
            <h1 id="titulo-cadastro">Crie sua Conta no Classic+</h1>

            
            <form class="auth-actions" action="#" method="POST">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="Crie uma senha forte">

                <label for="confirmar-senha">Confirmar Senha</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" required placeholder="Repita sua senha">

                <button type="submit" class="btn-auth register">
                    Finalizar Cadastro
                </button>
            </form>

            <p class="form-footer">
                Já tem uma conta? <a href="login.html">Fazer Login</a>
            </p>
        </section>

    </main>

</body>
</html>
