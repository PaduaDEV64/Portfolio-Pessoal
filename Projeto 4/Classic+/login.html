<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic+ | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

     
    <header class="navbar">
        <a href="index.html" aria-label="Voltar para a página inicial">
            <img src="imagens/logo-s.png" alt="Logo Classic Plus" class="logo-nav">
        </a>

        <nav aria-label="Navegação de retorno">
            <ul>
                <li><a href="index.html">← Voltar ao Início</a></li>
            </ul>
        </nav>
    </header>

    
    <main class="login-single-container">

        <section class="login-card" aria-labelledby="titulo-login">
            <h1 id="titulo-login">Entrar no Classic+</h1>

           
            <form class="auth-actions" action="#" method="POST">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="Digite sua senha">

                <button type="submit" class="btn-auth email">
                    Entrar
                </button>
            </form>

            <p class="form-footer">
                Não tem uma conta? <a href="cadastro.html">Inscreva-se</a>
            </p>
        </section>

    </main>

</body>
</html>
